[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarm-formation-spade"
version = "0.1.0"
description = "Multi-agent swarm formation control using SPSA consensus and hybrid LVP on SPADE"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "spade>=3.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

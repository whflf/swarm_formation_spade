name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy scipy "spade>=3.3" "sqlalchemy[asyncio]" greenlet ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest tests/ -v

      - name: Smoke test — end-to-end pipeline (tiny scale)
        run: python experiments/test_scale_fast.py --n 4 --seed 7 --warmup 200 --ctrl 5
